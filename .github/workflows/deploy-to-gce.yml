name: Deploy to GCE
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/C270-Team1
            git pull origin main
            sudo k3s kubectl apply -f studyhub/K8s/
            sudo k3s kubectl rollout restart deployment/studyhub-app
            sudo k3s kubectl rollout status deployment/studyhub-app --timeout=120s

  post-deploy-check:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify app is responding
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            CLUSTER_IP=$(sudo k3s kubectl get svc studyhub-service -o jsonpath='{.spec.clusterIP}')
            curl -f http://$CLUSTER_IP:80 || exit 1
