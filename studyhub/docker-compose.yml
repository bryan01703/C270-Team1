services:
  web:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    
    #reverse proxy for https + custom domain
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - web

volumes:
  mysql_data:
  caddy_data:



